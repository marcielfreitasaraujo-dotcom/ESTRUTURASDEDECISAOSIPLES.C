[build]
  publish = "."

# Domínio: https://www.araujooficial.com.br
# DNS no Registro.br (sem mexer no GitHub Pages da Realiza):
#   www  CNAME  finup-araujo-ia.netlify.app
#   @    A      75.2.60.5
# Depois, no Netlify: Domain management → Add domain alias → www.araujooficial.com.br

[[redirects]]
  from = "https://araujooficial.com.br/*"
  to = "https://www.araujooficial.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://araujooficial.com.br/*"
  to = "https://www.araujooficial.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.araujooficial.com.br/*"
  to = "https://www.araujooficial.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
