<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Nova senha · FinUP</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-body">
  <div class="auth-bg" aria-hidden="true"></div>
  <main class="auth-card">
    <div class="brand brand-lg brand-lockup">
      <img
        class="brand-logo brand-logo-full"
        src="{{ url_for('static', filename='img/logo-full.png') }}"
        alt="FinUP"
        width="220"
        height="220"
      >
    </div>
    <h1>Criar nova senha</h1>
    <p class="muted">Defina uma senha nova para entrar no FinUP.</p>
    {% if erro %}
      <div class="flash flash-erro">{{ erro }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Nova senha
        <input type="password" name="senha" autocomplete="new-password" required minlength="6" autofocus>
      </label>
      <label>
        Confirmar senha
        <input type="password" name="senha2" autocomplete="new-password" required minlength="6">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Salvar senha</button>
    </form>
  </main>
</body>
</html>
