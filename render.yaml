databases:
  - name: fincasa-db
    plan: free
    databaseName: fincasa
    user: fincasa

services:
  - type: web
    name: fincasa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fincasa-db
          property: connectionString
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_NOME
        value: Marciel
      - key: ADMIN_SENHA
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: PREFERRED_URL_SCHEME
        value: https
